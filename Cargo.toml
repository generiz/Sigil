[package]
name = "sigil-core"
version = "0.3.0"
edition = "2021"
description = "Core primitives for secure composition, pseudonymous identity and privacy-oriented messaging"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
blake3 = "1.5"
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
reed-solomon-erasure = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.100"
zeroize = "1.8"
