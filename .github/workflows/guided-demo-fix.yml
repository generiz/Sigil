name: guided-demo-fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_guided_playback.py'
      - '.github/workflows/guided-demo-fix.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden guided playback state
        run: python .github/scripts/fix_guided_playback.py
      - name: Commit demo fix
        run: |
          if git diff --quiet -- web-demo/embed.js; then
            exit 0
          fi
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add web-demo/embed.js
          git commit -m "harden guided playback state"
          git push
