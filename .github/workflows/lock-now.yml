name: lock-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-now.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "pin rust dependency resolution"
          git push
