name: guided-demo

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_guided_demo.py'
      - '.github/workflows/guided-demo.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add guided playback controls
        run: python .github/scripts/add_guided_demo.py
      - name: Commit demo update
        run: |
          if git diff --quiet -- web-demo/embed.js; then
            exit 0
          fi
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add web-demo/embed.js
          git commit -m "add guided protocol playback"
          git push
