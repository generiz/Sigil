name: format-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-now.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add '*.rs' 'src/**/*.rs' 2>/dev/null || true
          git add src
          git commit -m "format rust sources"
          git push
