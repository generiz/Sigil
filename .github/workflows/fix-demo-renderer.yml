name: fix-demo-renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-demo-renderer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authenticated receiver renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/wasm_demo.rs')
          s = p.read_text()
          needle = '''        serde_json::to_string(&result).map_err(js_error)\n    }\n}\n\n#[wasm_bindgen]\npub fn sigil_demo_version() -> String {'''
          replacement = '''        serde_json::to_string(&result).map_err(js_error)\n    }\n\n    /// Returns one authenticated receiver SymbolId for the visual renderer.\n    ///\n    /// This is intentionally separate from the public JSON result. Same-origin JavaScript can\n    /// observe any symbol it requests, so this bridge is a visualization API, not a browser\n    /// confidentiality boundary. A return value of 0 means reconstruction/authentication did not\n    /// complete for the supplied fragment set.\n    pub fn receiver_symbol_at(\n        &self,\n        index: usize,\n        missing_slots_csv: &str,\n    ) -> Result<u16, JsValue> {\n        let total = self.bundle.manifest().total_fragments();\n        let required = self.bundle.manifest().required_fragments();\n        let missing = parse_missing_slots(missing_slots_csv, total)?;\n        let available = self\n            .bundle\n            .fragments()\n            .iter()\n            .enumerate()\n            .filter(|(fragment_index, _)| !missing.contains(&(fragment_index + 1)))\n            .map(|(_, fragment)| fragment.clone())\n            .collect::<Vec<_>>();\n\n        if available.len() < required {\n            return Ok(0);\n        }\n\n        let reconstructed = match self.bundle.manifest().reconstruct(&available) {\n            Ok(value) => value,\n            Err(_) => return Ok(0),\n        };\n        if reconstructed != self.wire {\n            return Ok(0);\n        }\n\n        let received = match LayeredEnvelope::from_wire_bytes(&reconstructed) {\n            Ok(value) => value,\n            Err(_) => return Ok(0),\n        };\n        let opened = match received.open(\n            &self.message_secret,\n            &self.transport_secret,\n            &self.application_aad,\n            TRANSPORT_AAD,\n        ) {\n            Ok(value) => value,\n            Err(_) => return Ok(0),\n        };\n\n        let stream = SecureSymbolStream::from_encoded(opened).map_err(js_error)?;\n        let symbol_key = SymbolMapKey::from_message_secret(&self.message_secret);\n        let alphabet = (1u16..=256u16).map(SymbolId).collect::<Vec<_>>();\n        let symbol = stream\n            .decode_symbol_at(index, &alphabet, &symbol_key)\n            .map_err(js_error)?;\n        Ok(symbol.0)\n    }\n}\n\n#[wasm_bindgen]\npub fn sigil_demo_version() -> String {'''
          if needle not in s:
              raise SystemExit('wasm insertion point not found')
          p.write_text(s.replace(needle, replacement))

          p = Path('web-demo/embed.js')
          s = p.read_text()
          replacements = [
            ("    this.playback = 0;\n", "    this.playback = 0;\n    this.showReceiverSymbols = false;\n"),
            (".proof{min-width:170px;padding:17px;border:1px solid #354038;border-radius:12px;background:#0b100d;color:#91a095;font:700 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}", ".receiver-glyphs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:40px;margin-bottom:16px}.receiver-glyphs .glyph{font-size:18px;min-width:30px;height:36px}.proof{min-width:170px;padding:17px;border:1px solid #354038;border-radius:12px;background:#0b100d;color:#91a095;font:700 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}"),
            ("<div class=\"receiver-body\"><div class=\"peer\"></div><div class=\"peer-label\">LOOPBACK VERIFY</div><div id=\"receiverProof\" class=\"proof\">WAITING</div>", "<div class=\"receiver-body\"><div class=\"peer\"></div><div class=\"peer-label\">LOOPBACK VERIFY</div><div id=\"receiverGlyphs\" class=\"receiver-glyphs\"></div><div id=\"receiverProof\" class=\"proof\">WAITING</div>"),
            ("<b>Frontera del demo:</b> el origen web conoce los bytes que componés. La salida JSON no devuelve plaintext. Esto demuestra el pipeline criptográfico local, no un canal confidencial entre dos dispositivos.", "<b>Frontera del demo:</b> el origen web conoce los bytes que componés. La salida JSON no devuelve plaintext; tras autenticar, el renderer pide SymbolId uno por uno. El mismo origen puede observarlos. Esto demuestra el pipeline criptográfico local, no un canal confidencial entre dos dispositivos."),
            ("    this.$('receiverProof').textContent = 'WAITING';\n", "    this.$('receiverGlyphs').replaceChildren();\n    this.$('receiverProof').textContent = 'WAITING';\n"),
            ("    this.session = new this.module.DemoSession(Uint8Array.from(this.message));\n", "    this.showReceiverSymbols = !live;\n    this.session = new this.module.DemoSession(Uint8Array.from(this.message));\n"),
            ("  authenticated(result) {\n    return result.reconstruction_matches && result.outer_authenticated && result.inner_authenticated;\n  }\n\n  renderResult(result) {", "  authenticated(result) {\n    return result.reconstruction_matches && result.outer_authenticated && result.inner_authenticated;\n  }\n\n  renderReceiverSymbols() {\n    const host = this.$('receiverGlyphs');\n    host.replaceChildren();\n    if (!this.session || !this.showReceiverSymbols) return;\n    const missing = this.missingSlots().join(',');\n    for (let index = 0; index < this.message.length; index += 1) {\n      const symbolId = this.session.receiver_symbol_at(index, missing);\n      if (!symbolId) break;\n      const glyph = document.createElement('span');\n      glyph.className = 'glyph';\n      glyph.textContent = this.glyphLabel(symbolId - 1);\n      host.append(glyph);\n    }\n  }\n\n  renderResult(result) {"),
            ("    this.$('receiverProof').textContent = ok ? 'AUTHENTICATED' : 'NO DATA';\n", "    if (ok) this.renderReceiverSymbols(); else this.$('receiverGlyphs').replaceChildren();\n    this.$('receiverProof').textContent = ok ? 'AUTHENTICATED' : 'NO DATA';\n"),
            ("      ? 'Loopback autenticado. El contenido reconstruido no se devuelve al JavaScript público.'\n", "      ? 'Loopback autenticado. El JSON no contiene plaintext; el renderer solicita cada SymbolId autenticado para mostrarlo.'\n"),
            ("    const token = ++this.playback;\n    const result = JSON.parse(this.session.run(this.missingSlots().join(',')));\n", "    const token = ++this.playback;\n    this.showReceiverSymbols = true;\n    const result = JSON.parse(this.session.run(this.missingSlots().join(',')));\n"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'embed replacement not found: {old[:90]}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          needle = 'The browser demonstrator is a **single-process loopback**. The same WASM `DemoSession` generates both secrets, seals, fragments, reconstructs and opens the envelope. It is not a confidential two-party channel and does not implement authenticated key exchange.\n'
          extra = needle + '\nThe demo result JSON does not return receiver plaintext. After successful loopback authentication, the UI may request individual receiver `SymbolId` values through a renderer bridge. Same-origin JavaScript can observe those symbols; the bridge exists to demonstrate authenticated rendering and is not a browser confidentiality boundary.\n'
          if needle in s and 'renderer bridge' not in s:
              s = s.replace(needle, extra)
          p.write_text(s)

          p = Path('SECURITY.md')
          s = p.read_text()
          anchor = 'The current in-memory `ReplayGuard` rejects exact authenticated envelope replays within a bounded process-local window. It is not a substitute for ratchet message numbers, persistent replay state or a complete session protocol.\n'
          addition = anchor + '\n### Browser demonstrator\n\nThe browser demo returns only digests, fragment counts and authentication/reconstruction state in its JSON result. For visual confirmation after successful authentication, the renderer can request one `SymbolId` at a time from WASM. Same-origin JavaScript can observe those symbols and the original input bytes, so this API does not protect against an origin, extension or process compromise.\n'
          if anchor in s and '### Browser demonstrator' not in s:
              s = s.replace(anchor, addition)
          p.write_text(s)

          p = Path('docs/CRYPTO_PIPELINE.md')
          s = p.read_text()
          anchor = 'The reverse path resolves individual symbols for the renderer rather than first creating a normal text string.\n'
          addition = anchor + '\nIn the browser loopback demonstrator, the public result JSON does not contain receiver plaintext. After authentication, the renderer may request one `SymbolId` at a time from WASM. This is a visualization boundary only: same-origin JavaScript can observe the requested symbol and already owns the input bytes.\n'
          if anchor in s and 'public result JSON' not in s:
              s = s.replace(anchor, addition)
          p.write_text(s)
          PY
      - name: Format and test
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Commit
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add src/wasm_demo.rs web-demo/embed.js README.md SECURITY.md docs/CRYPTO_PIPELINE.md
          git commit -m "restore authenticated demo renderer"
          git push
