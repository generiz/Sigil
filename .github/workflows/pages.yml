name: demo-build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web-demo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build Rust core for WebAssembly
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Generate browser bindings
        run: |
          mkdir -p dist/pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/sigil_core.wasm \
            --out-dir dist/pkg \
            --out-name sigil_core \
            --target web
      - name: Assemble demo
        run: |
          cp web-demo/index.html dist/index.html
          cp web-demo/styles.css dist/styles.css
          cp web-demo/app.js dist/app.js
          touch dist/.nojekyll
          test -s dist/pkg/sigil_core_bg.wasm
          test -s dist/pkg/sigil_core.js
      - name: Publish demo build branch
        run: |
          rm -rf /tmp/sigil-demo
          mkdir -p /tmp/sigil-demo
          cp -a dist/. /tmp/sigil-demo/
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git checkout --orphan demo-dist
          git rm -rf .
          git clean -fdx
          cp -a /tmp/sigil-demo/. .
          git add -A
          git commit -m "update protocol demo build"
          git push --force origin demo-dist
